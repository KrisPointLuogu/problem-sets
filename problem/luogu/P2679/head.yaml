description: '有两个仅包含小写英文字母的字符串 $A$ 和 $B$。


  现在要从字符串 $A$ 中取出 $k$ 个互不重叠的非空子串，然后把这 $k$ 个子串按照其在字符串 $A$ 中出现的顺序依次连接起来得到一个新的字符串。请问有多少种方案可以使得这个新串与字符串
  $B$ 相等？


  注意：子串取出的位置不同也认为是不同的方案。'
