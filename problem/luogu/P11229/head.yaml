description: '小 S 喜欢收集小木棍。在收集了 $n$ 根长度相等的小木棍之后，他闲来无事，便用它们拼起了数字。用小木棍拼每种数字的方法如下图所示。


  ![](https://cdn.luogu.com.cn/upload/image_hosting/8zubqass.png)


  现在小 S 希望拼出一个**正**整数，满足如下条件：


  - 拼出这个数**恰好**使用 $n$ 根小木棍；

  - 拼出的数没有前导 $0$；

  - 在满足以上两个条件的前提下，这个数尽可能小。


  小 S 想知道这个数是多少，可 $n$ 很大，把木棍整理清楚就把小 S 折腾坏了，所以你需要帮他解决这个问题。如果不存在正整数满足以上条件，你需要输出 $-1$
  进行报告。'
