problem: P2671
title: '[NOIP 2015 普及组] 求和'
tags:
- 线性数据结构
- 排序
- 前缀和
description: '一条狭长的纸带被均匀划分出了 $n$ 个格子，格子编号从 $1$ 到 $n$。每个格子上都染了一种颜色 $color_i$（用 $[1,m]$
  当中的一个整数表示），并且写了一个数字 $number_i$。


  | 编号 | 1 | 2 | 3 | 4 | 5 | 6 |

  | :----------: | :----------: | :----------: | :----------: | :----------: | :----------:
  | :----------: |

  | **颜色和数字** | $\color{blue}{5}$ | $\color{blue}{5}$ | $\color{red}{3}$ | $\color{red}{2}$
  | $\color{blue}{2}$ | $\color{red}{2}$ |


  定义一种特殊的三元组：$(x,y,z)$，其中 $x,y,z$ 都代表纸带上格子的编号，这里的三元组要求满足以下两个条件：


  1. $x,y,z$ 都是整数，$x<y<z,y-x=z-y$。


  2. $color_x=color_z$。


  满足上述条件的三元组的分数规定为 $(x+z) \times (number_x+number_z)$。整个纸带的分数规定为所有满足条件的三元组的分数的和。这个分数可能会很大，你只要输出整个纸带的分数除以
  $10007$ 所得的余数即可。'
difficulty: 普及+/提高
