problem: P7910
title: '[CSP-J 2021] 插入排序'
tags:
- 枚举
- 排序
description: "插入排序是一种非常常见且简单的排序算法。小 Z 是一名大一的新生，今天 H 老师刚刚在上课的时候讲了插入排序算法。\n\n假设比较两个元素的时间为\
  \ $\\mathcal O(1)$，则插入排序可以以 $\\mathcal O(n^2)$ 的时间复杂度完成长度为 $n$ 的数组的排序。不妨假设这 $n$\
  \ 个数字分别存储在 $a_1, a_2, \\ldots, a_n$ 之中，则如下伪代码给出了插入排序算法的一种最简单的实现方式：\n\n这下面是 C/C++\
  \ 的示范代码：\n\n```cpp\nfor (int i = 1; i <= n; i++)\n\tfor (int j = i; j >= 2; j--)\n\
  \t\tif (a[j] < a[j-1]) {\n\t\t\tint t = a[j-1];\n\t\t\ta[j-1] = a[j];\n\t\t\ta[j]\
  \ = t;\n\t\t}\n```\n\n这下面是 Pascal 的示范代码：\n\n```pascal\nfor i:=1 to n do\n\tfor j:=i\
  \ downto 2 do\n\t\tif a[j]<a[j-1] then\n\t\t\tbegin\n\t\t\t\tt:=a[i];\n\t\t\t\t\
  a[i]:=a[j];\n\t\t\t\ta[j]:=t;\n\t\t\tend;\n```\n\n为了帮助小 Z 更好的理解插入排序，小 Z 的老师 H 老师留下了这么一道家庭作业：\n\
  \nH 老师给了一个长度为 $n$ 的数组 $a$，数组下标从 $1$ 开始，并且数组中的所有元素均为非负整数。小 Z 需要支持在数组 $a$ 上的 $Q$ 次操作，操作共两种，参数分别如下：\n\
  \n$1~x~v$：这是第一种操作，会将 $a$ 的第 $x$ 个元素，也就是 $a_x$ 的值，修改为 $v$。保证 $1 \\le x \\le n$，$1\
  \ \\le v \\le 10^9$。**注意这种操作会改变数组的元素，修改得到的数组会被保留，也会影响后续的操作**。\n\n$2~x$：这是第二种操作，假设\
  \ H 老师按照**上面的伪代码**对 $a$ 数组进行排序，你需要告诉 H 老师原来 $a$ 的第 $x$ 个元素，也就是 $a_x$，在排序后的新数组所处的位置。保证\
  \ $1 \\le x \\le n$。**注意这种操作不会改变数组的元素，排序后的数组不会被保留，也不会影响后续的操作**。\n\nH 老师不喜欢过多的修改，所以他保证类型\
  \ $1$ 的操作次数不超过 $5000$。\n\n小 Z 没有学过计算机竞赛，因此小 Z 并不会做这道题。他找到了你来帮助他解决这个问题。"
