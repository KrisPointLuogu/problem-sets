- 背包 DP
description: "在网友的国度中共有 $n$ 种不同面额的货币，第 $i$ 种货币的面额为 $a_i$，你可以假设每一种货币都有无穷多张。为了方便，我们把货币种数为\
  \ $n$、面额数组为 $a_1, a_2, \\cdots, a_n$ 的货币系统记作 $(n,a)$。 \n\n在一个完善的货币系统中，每一个非负整数的金额\
  \ $x$ 都应该可以被表示出，即对每一个非负整数 $x$，都存在 $n$ 个非负整数 $t_i$ 满足 $a_i \\times t_i$ 的和为 $x$。然而，\
  \ 在网友的国度中，货币系统可能是不完善的，即可能存在金额 $x$ 不能被该货币系统表示出。例如在货币系统 $n=3$, $a=[2,5,9]$ 中，金额 $1,3$\
  \ 就无法被表示出来。 \n\n两个货币系统 $(n,a)$ 和 $(m,b)$ 是等价的，当且仅当对于任意非负整数 $x$，它要么均可以被两个货币系统表示出，要么不能被其中任何一个表示出。\
  \ \n\n现在网友们打算简化一下货币系统。他们希望找到一个货币系统 $(m,b)$，满足 $(m,b)$ 与原来的货币系统 $(n,a)$ 等价，且 $m$\
  \ 尽可能的小。他们希望你来协助完成这个艰巨的任务：找到最小的 $m$。"
