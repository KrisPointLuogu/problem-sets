title: '[NOIP 1999 普及组] 回文数'
tags:
- 模拟
- 高精度
- 进制
description: "若一个数（首位不为零）从左向右读与从右向左读都一样，我们就将其称为回文数。\n\n例如，给定一个十进制数 $56$，将 $56$ 加 $65$（即把\
  \ $56$ 从右向左读），得到的 $121$ 是一个回文数。\n\n又如，对于十进制数 $87$：\n\nSTEP1：$87+78=165$  \nSTEP2：$165+561=726$\
  \  \nSTEP3：$726+627=1353$   \nSTEP4：$1353+3531=4884$  \n\n在这里，一步是指进行一次 $N$ 进制加法，上例最少用了\
  \ $4$ 步得到回文数 $4884$。\n\n请编写程序，给定一个 $N$ 进制数 $M$，求最少经过几步可以得到回文数。如果在 $30$ 步以内（包含 $30$\
  \ 步）不可能得到回文数，则输出 `Impossible!`。\n\n其中，$2\\le N\\le 10$ 或 $N=16$，$M$ 的长度不超过 $100$\
  \ 位，且只包含数字或大写字母。"
