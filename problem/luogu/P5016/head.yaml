problem: P5016
title: '[NOIP 2018 普及组] 龙虎斗'
tags:
- 模拟
- 枚举
description: "轩轩和凯凯正在玩一款叫《龙虎斗》的游戏，游戏的棋盘是一条线段，线段上有 $n$ 个兵营（自左至右编号 $1 \\sim n$），相邻编号的兵营之间相隔\
  \ $1$ 厘米，即棋盘为长度为 $n-1$ 厘米的线段。$i$ 号兵营里有 $c_i$ 位工兵。下面图 1 为 $n=6$ 的示例： \n\n![](https://cdn.luogu.com.cn/upload/pic/43224.png)\
  \    \n\n轩轩在左侧，代表“龙”；凯凯在右侧，代表“虎”。 他们以 $m$ 号兵营作为分界， 靠左的工兵属于龙势力，靠右的工兵属于虎势力，而第 $m$\
  \ 号兵营中的工兵很纠结，他们不属于任何一方。    \n\n一个兵营的气势为：该兵营中的工兵数$ \\times $ 该兵营到 $m$ 号兵营的距离；参与游戏\
  \ 一方的势力定义为：属于这一方所有兵营的气势之和。    \n下面图 2 为 $n = 6,m = 4$ 的示例，其中红色为龙方，黄色为虎方：\n\n![](https://cdn.luogu.com.cn/upload/pic/43225.png)\
  \  \n\n游戏过程中，某一刻天降神兵，共有 $s_1$ 位工兵突然出现在了 $p_1$ 号兵营。作为轩轩和凯凯的朋友，你知道如果龙虎双方气势差距太悬殊，轩轩和凯凯就不愿意继续玩下去了。为了让游戏继续，你需要选择一个兵营\
  \ $p_2$，并将你手里的 $s_2$ 位工兵全部派往 兵营 $p_2$，使得双方气势差距尽可能小。 \n\n 注意：你手中的工兵落在哪个兵营，就和该兵营中其他工兵有相同的势力归属（如果落在\
  \ $m$ 号兵营，则不属于任何势力）。"
