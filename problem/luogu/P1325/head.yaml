title: '[ICPC 2002 Beijing R] 雷达安装'
tags:
- 贪心
- 计算几何
- 排序
description: '假设海岸线是一条无限延伸的直线。它的一侧是陆地，另一侧是海洋。每一座小岛是在海面上的一个点。雷达必须安装在陆地上（包括海岸线），并且每个雷达都有相同的扫描范围
  $d$。你的任务是建立尽量少的雷达站，使所有小岛都在扫描范围之内。


  数据使用笛卡尔坐标系，定义海岸线为 $x$ 轴。在 $x$ 轴上方为海洋，下方为陆地。'
